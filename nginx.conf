server {
    listen 80;
    server_name api.qrapp;

    client_max_body_size 2M;

    error_page 413 = /400.json;

    location = /400.json {
        internal;
        default_type application/json;
        return 400 '{"message":"BAD_REQUEST","error": "File size exceeds 2MB limit"}';
    }

    error_page 502 504 = /fallback.json;

    location = /fallback.json {
        internal;
        default_type application/json;
        return 500 '{"error":"SERVER_ERROR","message":"Hệ thống đang bận, vui lòng thử lại sau."}';
    }

    location / {
        proxy_pass         http://qrapp-backend:8000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        # Host & protocol
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port $server_port;
        # IP
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Timestamp
        proxy_set_header   X-Request-Start $msec;
        # Headers HTTP gốc từ client
        proxy_set_header   User-Agent $http_user_agent;
        proxy_set_header   Referer $http_referer;
        proxy_set_header   Origin $http_origin;
    }
}
